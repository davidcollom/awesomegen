# Release pipeline for awesomegen.
#
# Triggered by pushing a semver tag (`vMAJOR.MINOR.PATCH`).
#
# Design notes
# ------------
# * The workflow is split into four jobs with narrowly scoped permissions:
#     - `goreleaser` builds the artefacts, publishes the GitHub release and
#       pushes the multi-architecture container image to GHCR under a staging
#       tag.
#     - `sbom` attaches an aggregate SPDX SBOM to the release.
#     - `sign` signs the artefacts with cosign (keyless, via OIDC) and
#       records a GitHub build provenance attestation.
#     - `publish` publishes the release and moves the tags of the container
#       image that consumers use. The tags only move once every other job
#       has succeeded, so a consumer never pulls an image whose release was
#       not completed.
# * `id-token: write` is granted to the `sign` job only. Keyless signing and
#   artifact attestations both need an OIDC token, and no other job needs
#   one.
# * Every third-party action is pinned to a full 40 character commit SHA with
#   the human readable version in the adjacent comment.
# * No secret is echoed into the logs: tokens are passed through `env` and
#   `docker/login-action` masks the registry password.

name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release that is already publishing.
  cancel-in-progress: false

env:
  GO_VERSION: '1.26.x'
  GORELEASER_VERSION: '~> v2'
  # Syft is used by GoReleaser to build the per-archive SBOMs.
  SYFT_VERSION: '1.55.0'
  SYFT_SHA256: 'bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d'
  COSIGN_VERSION: 'v3.0.6'
  # Check the sources out with the line endings they are stored with.
  #
  # The release has to build the same artefacts from the same commit every
  # time, so the working tree may not depend on the platform the runner
  # happens to use. The setting is passed through the environment, so that
  # it applies to the checkout itself.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'

jobs:
  goreleaser:
    name: build and publish
    runs-on: ubuntu-latest
    permissions:
      # Create the GitHub release and upload its assets.
      contents: write
      # Push the container image to GHCR.
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser needs the full history to build the changelog.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Install syft
        # GoReleaser shells out to syft to produce the SBOMs. The download is
        # pinned to a version and verified against the published checksum.
        #
        # The binary is installed into the home directory of the runner: a
        # hosted runner does not run the job as root, so /usr/local/bin is
        # not writable.
        run: |
          set -euo pipefail
          url="https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/syft.tar.gz "$url"
          # Compare the digests by hand: `sha256sum --check` is not
          # available on every platform (BusyBox only understands `-c`).
          actual="$(sha256sum /tmp/syft.tar.gz | cut -d' ' -f1)"
          if [ "${actual}" != "${SYFT_SHA256}" ]; then
            echo "::error::Checksum mismatch for syft: expected ${SYFT_SHA256}, got ${actual}"
            exit 1
          fi
          bindir="${HOME}/.local/bin"
          mkdir -p "${bindir}"
          tar -xzf /tmp/syft.tar.gz -C "${bindir}" syft
          chmod +x "${bindir}/syft"
          # The directory is added to the PATH of the steps that follow.
          echo "${bindir}" >> "${GITHUB_PATH}"
          syft version

      - name: Set up Docker Buildx
        # `dockers_v2` builds the image with buildx.
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Turn a published release back into a draft
        # GoReleaser only looks for a draft release (see `use_existing_draft`
        # in .goreleaser.yaml), so a release that was already published
        # cannot be updated by a repeated run of this workflow: the run
        # fails with "tag_name already exists".
        #
        # The release is turned back into a draft before GoReleaser runs, so
        # that a repeated run updates the release instead of failing. The
        # `publish` job publishes it again once every artefact is in place.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A draft release has no tag yet, so the API does not find it by
          # its tag and the command fails. There is nothing to restore then:
          # the release is a draft already, or it does not exist yet.
          if ! draft="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            echo "The release ${TAG} is not published: there is nothing to restore"
            exit 0
          fi
          if [ "${draft}" = "true" ]; then
            echo "The release ${TAG} is a draft already"
            exit 0
          fi
          gh release edit "${TAG}" --draft=true --repo "${GITHUB_REPOSITORY}"
          echo "Turned the published release ${TAG} back into a draft"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          # `--skip=sign`: the artefacts are signed by the `sign` job below,
          # which is the only job with an OIDC token.
          #
          # The release is created as a draft (see the `draft` setting in
          # .goreleaser.yaml). The `publish` job promotes it once the
          # signatures, the attestation and the SBOM are in place.
          args: release --clean --skip=sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the release artefacts for signing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sbom.json
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7

  sbom:
    name: sbom
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      # Attach the SBOM to the release that GoReleaser created.
      contents: write
      # The action downloads the workflow artefact through the REST API of
      # the Actions before it attaches it to the release, and that download
      # needs this permission.
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate the SBOM and attach it to the release
        # GoReleaser already attaches a per-archive SBOM to the release.
        # This step adds one aggregate SBOM for the whole source tree.
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          artifact-name: sbom.spdx.json
          output-file: ./sbom.spdx.json
          upload-artifact: true
          upload-artifact-retention: 7
          upload-release-assets: true
          dependency-snapshot: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sign:
    name: sign and attest
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      # Keyless cosign signing and the GitHub attestation both authenticate
      # with the workflow's OIDC identity.
      id-token: write
      # Write the provenance attestation to GitHub's attestation store.
      attestations: write
      # Attach the signatures to the release.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the release artefacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: dist

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign the artefacts (keyless, OIDC)
        # The signature is a Sigstore bundle: it carries the certificate, the
        # signature and the transparency log entry, so no long lived key has
        # to be managed. The signing identity is the workflow run itself and
        # is recorded in the bundle.
        run: |
          set -euo pipefail
          shopt -s nullglob
          signed=0
          for artefact in dist/*.tar.gz dist/*.zip; do
            [ -e "$artefact" ] || continue
            echo "Signing ${artefact}"
            cosign sign-blob --yes --bundle "${artefact}.sigstore.json" "$artefact"
            signed=$((signed + 1))
          done
          if [ "$signed" -eq 0 ]; then
            echo "::error::No artefacts to sign were found in dist/"
            exit 1
          fi
          # Sign the checksum manifest as well: verifying this single
          # signature transitively covers every archive listed in it.
          cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
          echo "Signed ${signed} archive(s) and checksums.txt"

      - name: Attach the signatures to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          signatures=(dist/*.sigstore.json)
          if [ "${#signatures[@]}" -eq 0 ]; then
            echo "::error::No signature bundles were produced"
            exit 1
          fi
          gh release upload "${GITHUB_REF_NAME}" "${signatures[@]}" --clobber --repo "${GITHUB_REPOSITORY}"

      - name: Attest the build provenance
        # One attestation covers every archive, because the subjects are
        # taken from the checksum file.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
          show-summary: true

  publish:
    name: publish the release
    # The release stays a draft until everything that belongs to it is in
    # place. The composite action resolves "latest" through the API, and
    # the API does not return drafts, so a release that is published too
    # early could be installed before its signature exists - or without one
    # at all, when the signing job fails.
    needs: [goreleaser, sbom, sign]
    runs-on: ubuntu-latest
    permissions:
      # Promote the draft to a published release.
      contents: write
      # Move the tags of the container image.
      packages: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A draft that never reaches this step is never published, which
          # is the point: the artefacts stay available for inspection.
          #
          # The repository is named explicitly: this job does not check the
          # sources out, so there is no git remote that "gh" could read the
          # repository from.
          gh release edit "${TAG}" --draft=false --repo "${GITHUB_REPOSITORY}"
          echo "Published ${TAG}"

      - name: Set up Docker Buildx
        # `imagetools` is part of buildx. The action installs it and makes
        # its version the one that is used.
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the container tags
        # GoReleaser pushed the image with a staging tag. The tags that
        # consumers use are moved here, after the signatures, the attestation
        # and the SBOM are in place, so that a consumer never pulls an image
        # whose release was not completed.
        #
        # The staging tag is left in place: it is the source of the
        # promotion, so a repeated run of this job can promote the image
        # again.
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          staging="${GHCR_IMAGE}:${TAG}-staging"
          # The version tag always moves: the image of this release is
          # reachable under the version it was built from.
          tags=(--tag "${GHCR_IMAGE}:${TAG}")
          promoted="${TAG}"
          # A tag with a pre-release suffix ("v1.2.3-rc1") is a pre-release.
          # It only moves its own version tag: "latest", "vMAJOR" and
          # "vMAJOR.MINOR" keep pointing at the last stable release, so a
          # release candidate is never installed as the current version.
          #
          # This is the same rule that .goreleaser.yaml applies to the
          # release itself ("prerelease: auto"), so the GitHub release and
          # the container tags agree about what a pre-release is.
          case "${TAG}" in
            *-*)
              echo "::notice::${TAG} is a pre-release: only its version tag is moved"
              ;;
            *)
              # "v1.2.3" becomes "v1" and "v1.2".
              major="${TAG%%.*}"
              minor="${TAG%.*}"
              tags+=(
                --tag "${GHCR_IMAGE}:${major}"
                --tag "${GHCR_IMAGE}:${minor}"
                --tag "${GHCR_IMAGE}:latest"
              )
              promoted="${TAG}, ${major}, ${minor} and latest"
              ;;
          esac
          # The manifest of the staging tag is copied as it is, so the
          # attestation of the image travels with it.
          docker buildx imagetools create "${tags[@]}" "${staging}"
          echo "Promoted ${staging} to ${promoted}"
