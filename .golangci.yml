# golangci-lint configuration for awesomegen.
#
# Configuration schema: v2
#   https://golangci-lint.run/product/configuration-file/
#
# The linter is pinned to the version in .github/workflows/ci.yml and in the
# Makefile, so a lint run is reproducible.
version: "2"

run:
  timeout: 5m
  # Analyse the test files as well.
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - gocritic
    - revive
  settings:
    govet:
      enable-all: true
      disable:
        # Reports how a struct could be reordered to save memory. That is
        # noise for the configuration types in this project.
        - fieldalignment
        # The shadow analyzer reports every short variable declaration that
        # hides an outer one. It is far too noisy for the size of this code
        # base and does not find real bugs here.
        - shadow
    gocritic:
      disabled-checks:
        # `os.Exit` inside a function that has a deferred call is a real
        # smell, but restructuring main() is not worth failing a build over.
        # Tracked in BACKLOG.md.
        - exitAfterDefer
    staticcheck:
      checks:
        - all
        # The package level documentation lives in the README, and the
        # exported identifiers are documented where it matters.
        - -ST1000
        - -ST1003
        - -ST1020
        - -ST1021
        - -ST1022
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    generated: lax
    rules:
      # Test code is allowed to ignore errors and to be a little sloppy.
      - path: _test\.go
        linters:
          - errcheck
          - gocritic
          - revive
      # `slug` in internal/render/helpers.go is dead code. It is removed in
      # a separate change; until then the finding is excluded here so that
      # the lint job stays green. Tracked in BACKLOG.md.
      - path: internal/render/helpers\.go
        text: "^func slug is unused$"
        linters:
          - unused

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
