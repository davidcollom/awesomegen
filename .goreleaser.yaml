# GoReleaser configuration for awesomegen.
#
# Reference: https://goreleaser.com/customization/
#
# Notes
# -----
# * `dockers_v2` replaces the deprecated `dockers` + `docker_manifests` pair:
#   it builds the multi-architecture image and pushes the manifest in a single
#   `docker buildx build --push` call.
# * Signing is configured here but is executed by the release workflow in a
#   dedicated job (see .github/workflows/release.yml). That job is the only
#   one that is granted `id-token: write`, because keyless cosign signing
#   needs an OIDC token. The workflow therefore runs GoReleaser with
#   `--skip=sign`.
version: 2
project_name: awesomegen

env:
  - CGO_ENABLED=0
  - GH_OWNER=davidcollom
  - VERSION="{{ .Version }}"
  - TAG="{{ .Tag }}"

before:
  hooks:
    # Fetch the modules and verify them against go.sum. `go mod tidy` is
    # deliberately not used here: it may rewrite go.mod/go.sum and the
    # release would then be built from something other than what is
    # committed.
    - go mod download
    - go mod verify
    # config-schema.json is generated from the Go types. Fail the release
    # when the committed schema is stale, so the published schema always
    # matches the released binary.
    #
    # GoReleaser tokenises a hook instead of running it through a shell, so
    # the generation and the comparison are two hooks: a single hook with an
    # `&&` would silently be truncated at the first unquoted one.
    - go generate ./...
    - git diff --exit-code -- config-schema.json

builds:
  - id: awesomegen
    main: ./cmd/awesomegen
    binary: awesomegen
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    # Reproducible builds: the timestamp of the module cache is pinned to the
    # commit time, so two builds of the same commit produce identical
    # binaries.
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: archives
    ids: [awesomegen]
    format_overrides:
      - goos: windows
        formats: ["zip"]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  use: git
  sort: asc
  abbrev: -1
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore\(deps\):'
      - '^chore: bump'
      - Merge pull request
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: "Bug fixes"
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: "Documentation"
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999

# Per-archive SBOMs. GoReleaser shells out to syft, which the release
# workflow installs (with a pinned version and checksum) before it runs.
sboms:
  - id: sbom
    artifacts: archive
    cmd: syft
    args:
      - "$artifact"
      - "--output"
      - "spdx-json=$artifact.sbom.json"

# Keyless signing with cosign.
#
# `goreleaser release` signs the checksum file; verifying that single
# signature transitively covers every archive listed in it. The release
# workflow skips this pipe and signs the artifacts in a dedicated job, so
# that the OIDC token is only available to the signing job.
signs:
  - id: cosign
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

# macOS notarization.
#
# Deliberately disabled: notarizing a macOS binary requires an Apple
# Developer Program membership (a paid account), a "Developer ID
# Application" certificate exported as .p12 and an App Store Connect API
# key. Enable the block below once those credentials exist and are stored as
# the MACOS_CERTIFICATE / MACOS_CERTIFICATE_PASSWORD / MACOS_API_KEY
# repository secrets.
#
# notarize:
#   macos:
#     issuer_id: "{{ .Env.MACOS_ISSUER_ID }}"
#     key: "{{ .Env.MACOS_API_KEY }}"
#     key_id: "{{ .Env.MACOS_API_KEY_ID }}"

# Multi-architecture container image.
#
# `dockers_v2` needs `docker/setup-buildx-action` to have run and the
# registry to be logged in; the release workflow does both.
dockers_v2:
  - id: awesomegen
    # This Dockerfile copies the binaries that GoReleaser has already built
    # instead of building them again, so the image contains exactly the
    # artifacts that are published and signed.
    dockerfile: Dockerfile.goreleaser
    images:
      - "ghcr.io/{{ .Env.GH_OWNER }}/{{ .ProjectName }}"
    tags:
      # The image is pushed to a staging tag only.
      #
      # The tags that consumers use - the version, the major version, the
      # minor version and "latest" - are promoted by the `publish` job of the
      # release workflow, after the signatures, the attestation and the SBOM
      # are in place. A consumer that pulls "latest" therefore never
      # receives an image whose release has not been completed.
      - "{{ .Tag }}-staging"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "Generate Awesome lists from GitHub Star Lists"
      org.opencontainers.image.source: "https://github.com/{{ .Env.GH_OWNER }}/{{ .ProjectName }}"
      org.opencontainers.image.licenses: "MIT"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
    annotations:
      org.opencontainers.image.created: "{{ .Date }}"
    # Attach an SBOM to the published image.
    sbom: true

# Snapshot builds are never a release: mark them clearly so a snapshot
# artefact can never be mistaken for a published one.
snapshot:
  version_template: "{{ incpatch .Version }}-next"

report_sizes: true

release:
  # The release is created as a draft. The signing and the SBOM jobs attach
  # their artefacts to it, and the `publish` job of the release workflow
  # promotes it to a published release only after they have succeeded.
  #
  # Publishing it directly would make an incomplete release visible: the
  # composite action resolves "latest" through the API, so it could install
  # a release whose signatures and attestations do not exist yet - or that
  # is never signed at all, because the signing job failed.
  draft: true
  prerelease: false
